<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erika Silva - Beleza & Progressiva</title>
  <!-- MENU LATERAL -->
  <style>
    * {margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body {background:#000;color:#fff;}
    .menu-btn {position:fixed;top:20px;left:20px;z-index:1000;font-size:30px;background:#ff006e;color:white;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;}
    .overlay {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:998;display:none;}
    .side-menu {position:fixed;top:0;left:-300px;width:300px;height:100vh;background:#121212;color:white;z-index:999;transition:left 0.3s ease;padding-top:60px;}
    .side-menu.open {left:0;}
    .menu-close {position:absolute;top:15px;right:20px;font-size:24px;background:none;border:none;color:#ff006e;cursor:pointer;}
    .menu-principal {display:block;padding:15px 25px;color:#fff;text-decoration:none;border-bottom:1px solid #222;font-weight:bold;}
    .menu-principal:hover {background:#ff006e;}
    .sub-item {display:block;padding:12px 25px 12px 40px;color:#ddd;text-decoration:none;border-bottom:1px solid #1a1a1a;}
    .sub-item:hover {color:#ff006e;padding-left:45px;}
    .menu-divider {height:2px;background:#ff006e;margin:20px 25px;}
    .menu-final {color:#ff006e;font-weight:bold;}
    /* CONTEÚDO DO SITE */
    .conteudo {text-align:center;padding:80px 20px;}
    h1 {color:#ff006e;font-size:36px;}
    .botao-whatsapp {background:#ff006e;color:white;padding:15px 30px;border-radius:50px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:25px;}
  </style>
</head>
<body>

<!-- BOTÃO MENU -->
<button class="menu-btn" onclick="abrirMenu()">☰</button>

<!-- FUNDO ESCURO -->
<div class="overlay" onclick="fecharMenu()"></div>

<!-- MENU LATERAL -->
<nav class="side-menu" id="menuLateral">
  <button class="menu-close" onclick="fecharMenu()">✕</button>
  <a href="https://wa.me/5545999605984" target="_blank" class="menu-principal">📅 Agendamentos</a>
  <span class="menu-principal">💼 Trabalhos / Serviços</span>
  <a href="#progressiva" class="sub-item">▫️ Progressiva</a>
  <a href="#hidratacao" class="sub-item">▫️ Hidratação</a>
  <a href="#escova" class="sub-item">▫️ Escova</a>
  <a href="#outros" class="sub-item">▫️ Outros Tratamentos</a>
  <a href="#avaliar" class="menu-principal">⭐ Faça sua Avaliação</a>
  <div class="menu-divider"></div>
  <a href="#suporte" class="menu-principal menu-final">🛟 Suporte e Ajuda</a>
</nav>

<!-- FUNÇÕES MENU -->
<script>
function abrirMenu(){document.getElementById('menuLateral').classList.add('open');document.querySelector('.overlay').style.display='block';}
function fecharMenu(){document.getElementById('menuLateral').classList.remove('open');document.querySelector('.overlay').style.display='none';}
</script>

<!-- CONTEÚDO PRINCIPAL -->
<div class="conteudo">
  <h1>Erika Silva</h1>
  <p style="font-size:22px;color:#ff006e;margin:10px 0;">BELEZA & PROGRESSIVA</p>
  <p style="font-size:18px;max-width:400px;margin:auto;">Realce sua beleza com cabelos mais lisos, saudáveis e cheios de brilho ✨</p>
  <a href="https://wa.me/5545999605984" target="_blank" class="botao-whatsapp">📞 AGENDAR PELO WHATSAPP</a>
</div>

</body>
</html>
